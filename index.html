<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tournament Live Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #153e35; color: #fff; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo-icon img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text {
      font-size: 18px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.5px; line-height: 1.3;
    }
    .logo-sub {
      font-size: 13px; opacity: 0.6;
      text-align: center;
    }
    p { font-size: 16px; opacity: 0.8; }
    #iframeWrapper {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    #launcherIframe {
      position: absolute; top: 0; left: 0;
      display: block; border: none;
      transform-origin: top left;
    }
  </style>
</head>
<body id="loadingScreen">
  <div id="loadingContent">
    <div class="logo-icon"><img src="LOGO_BASE64_HERE" alt="Tournament Logo"></div>
    <div class="logo-text">Interdepartmental<br>Volleyball Tournament</div>
    <div class="logo-sub">2026</div>
    <div class="spinner"></div>
    <p>Loading Tournament Live Score...</p>
  </div>
  <div id="iframeWrapper" style="display:none;">
    <iframe id="launcherIframe" referrerpolicy="no-referrer" allowfullscreen allow="fullscreen"></iframe>
  </div>
  <script>
    var BASE_URL = 'https://script.google.com/macros/s/AKfycbw9lx36PEvVOCDUgzYLcQ6JBa527EF2emEolVhXn8D08RZWAi70fprFgHc-GVFlRzKO/exec?mode=scoreboard';

    var iframe = document.getElementById('launcherIframe');
    var loading = document.getElementById('loadingContent');
    var wrapper = document.getElementById('iframeWrapper');

    /*
     * Mobile browsers assign ~980px layout viewport to cross-origin iframes.
     * We render the iframe at 980px (the width the browser will assign)
     * then scale it down proportionally to fit the actual screen width.
     * This ensures the content fills the screen without overflowing.
     */
    function sizeIframe() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var DESKTOP_WIDTH = 980;

      wrapper.style.width = vw + 'px';
      wrapper.style.height = vh + 'px';

      if (vw < DESKTOP_WIDTH) {
        var scale = vw / DESKTOP_WIDTH;
        iframe.style.width = DESKTOP_WIDTH + 'px';
        iframe.style.height = (vh / scale) + 'px';
        iframe.style.transform = 'scale(' + scale + ')';
      } else {
        iframe.style.width = vw + 'px';
        iframe.style.height = vh + 'px';
        iframe.style.transform = '';
      }
    }

    function showIframe() {
      loading.style.display = 'none';
      wrapper.style.display = 'block';
      iframe.src = BASE_URL;
    }

    // Pre-size while loading screen is visible
    sizeIframe();
    // Show iframe after 1.5 seconds
    setTimeout(showIframe, 1500);

    iframe.addEventListener('load', function() {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        wrapper.style.display = 'block';
      }
    });

    var lastVw = window.innerWidth;
    var lastVh = window.innerHeight;
    var resizeTimer;

    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        var nvw = window.innerWidth;
        var nvh = window.innerHeight;
        if (nvw !== lastVw || nvh !== lastVh) {
          lastVw = nvw;
          lastVh = nvh;
          sizeIframe();
        }
      }, 250);
    });
    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        var nvw = window.innerWidth;
        var nvh = window.innerHeight;
        if (nvw !== lastVw || nvh !== lastVh) {
          lastVw = nvw;
          lastVh = nvh;
          sizeIframe();
        }
      }, 400);
    });
  </script>
</body>
</html>
