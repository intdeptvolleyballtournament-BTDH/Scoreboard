<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Application Portal</title>
  <meta name="description" content="Seamless Mobile Responsive Web Application">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* Hide scrollbars across all browsers while keeping screen fitted */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      background-color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar, #frame-wrapper::-webkit-scrollbar, iframe::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    #frame-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      -webkit-overflow-scrolling: touch;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      border: 0 !important;
      outline: none !important;
      display: block;
      overflow: hidden !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      gap: 12px;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-family: sans-serif; font-size: 13px;">Loading application...</div>
  </div>

  <div id="frame-wrapper">
    <iframe
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycby9s7XhtQvKC2oxxKlxb-2I8jUfjEugnGQkerB7xf4plcDwbjNGYBq02geuBgyyB83j/exec?mode=scoreboard"
      scrolling="no"
      frameborder="0"
      allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
      onload="document.getElementById('loading-overlay').style.opacity = '0'; setTimeout(() => document.getElementById('loading-overlay').remove(), 350);"
    ></iframe>
  </div>
</body>
</html>
